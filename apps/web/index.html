<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        // Light backgrounds per tone; keep in sync with LIGHT_TONE_BACKGROUND in
        // src/appearance.ts and --tone-background in src/index.css.
        const LIGHT_BACKGROUNDS = { bright: "#fcfcfc", soft: "#f3f3f3", paper: "#f7f3ec" };
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);

          // Appearance settings live in the client-settings blob. Reading it here
          // keeps the first paint at the right tone, text scale, and direction
          // instead of flashing bright/LTR while the app hydrates.
          let appearance = {};
          try {
            appearance = JSON.parse(window.localStorage.getItem("t3code:client-settings:v1")) || {};
          } catch {
            appearance = {};
          }
          const tone = LIGHT_BACKGROUNDS[appearance.lightTone] ? appearance.lightTone : "soft";
          document.documentElement.dataset.lightTone = tone;
          const fontScale = appearance.fontScale;
          if (typeof fontScale === "number" && fontScale >= 80 && fontScale <= 140) {
            document.documentElement.style.setProperty("--font-scale", String(fontScale / 100));
          }
          if (appearance.reduceMotion === true) {
            document.documentElement.dataset.reduceMotion = "true";
          }
          const language = appearance.language;
          const preferred =
            language === "en" || language === "ar"
              ? language
              : (navigator.languages || [navigator.language || "en"])
                  .map((tag) => String(tag).toLowerCase().split("-")[0])
                  .find((base) => base === "en" || base === "ar") || "en";
          document.documentElement.lang = preferred;
          document.documentElement.dir = preferred === "ar" ? "rtl" : "ltr";

          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUNDS[tone];
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #fcfcfc;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          "Noto Sans Arabic Variable",
          "Noto Sans Arabic",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html[data-light-tone="soft"] body {
        background: #f3f3f3;
      }

      html[data-light-tone="paper"] body {
        background: #f7f3ec;
        color: #38332e;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
